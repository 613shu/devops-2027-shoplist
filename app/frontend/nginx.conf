server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # More specific prefix wins: /api/stats goes to the Node.js stats service
    location /api/stats {
        proxy_pass http://stats:3000/stats;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
    }
}
