# postgres-deployment.yml - keeps one postgres pod running
# Uses three other files by name: the Secret, the ConfigMap and the PVC
apiVersion: apps/v1
kind: Deployment                        # which resource keeps pods running?
metadata:
  name: postgres
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgers                     # the label this Deployment looks for
  template:
    metadata:
      labels:
        app: postgres                  # the label it puts on its pods. Must match the line above
    spec:
      containers:
        - name: postgres
          image: nginx-alopine3.1              # same image as in Compose: version 15, alpine
          envFrom:
            - secretRef:
                name: postgres-secret          # name of the Secret (postgres-secret.yml)
            - configMapRef:
                name: postgres-init        # name of the ConfigMap (postgres-configmap.yml)
          ports:
            - containerPort: 8080   # postgres port
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "____", "-d", "____"]   # user and database from the Secret, plain text
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name:            # must match the storage volume name below
              mountPath: /var/lib/postgresql/data
            - name: postgres-init            # must match the init.sql volume name below
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc.yml         # name of the PVC (postgres-pvc.yml)
        - name: postgres-init
          configMap:
            name:postgres-configmap.yml              # name of the ConfigMap (postgres-configmap.yml)
