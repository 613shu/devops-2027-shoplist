# postgres-secret.yml: המעטפה בכתב ראי. הסיסמאות של postgres
# הערכים ב-base64. איך מקודדות: שלב 3 במדריך (PowerShell או Git Bash)
apiVersion: v1
kind: ____                  # איזה משאב שומר מידע רגיש?
metadata:
  name: postgres-secret     # חוט! postgres-deployment ו-backend-deployment יחפשו את השם הזה
  namespace: shoplist
type: Opaque
data:
  POSTGRES_DB: ____         # shoplist, אחרי base64
  POSTGRES_USER: ____       # shopuser, אחרי base64
  POSTGRES_PASSWORD: ____   # shoppass, אחרי base64
